<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Abia Chamber of Commerce social sharing graphic</title>
  <desc id="desc">A social media banner for Abia Chamber of Commerce, featuring a civic building, community connection motif, and the message connecting businesses and building prosperity.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173B63"/>
      <stop offset="1" stop-color="#0B2038"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#E69A24"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69B96B"/>
      <stop offset="1" stop-color="#287A4B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#navy)"/>
  <circle cx="1080" cy="80" r="250" fill="#FFFFFF" opacity=".035"/>
  <circle cx="80" cy="610" r="260" fill="#FFFFFF" opacity=".035"/>
  <path d="M0 510 C250 445 430 585 690 525 S1030 455 1200 500 V630 H0Z" fill="#07182A" opacity=".55"/>

  <!-- Abia-inspired civic and business emblem -->
  <g transform="translate(105 100)">
    <circle cx="205" cy="205" r="178" fill="#FFFFFF" opacity=".07" stroke="url(#gold)" stroke-width="6"/>
    <circle cx="205" cy="205" r="154" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".3"/>

    <!-- Rising sun -->
    <path d="M145 118 A60 60 0 0 1 265 118" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
    <g stroke="url(#gold)" stroke-width="7" stroke-linecap="round">
      <path d="M205 35 V55 M125 58 L140 75 M285 58 L270 75"/>
    </g>

    <!-- Chamber building -->
    <path d="M70 155 L205 88 L340 155Z" fill="url(#gold)"/>
    <path d="M83 160 H327 V181 H83Z" fill="#FFFFFF"/>
    <path d="M100 190 H310 V320 H100Z" fill="#F7F8F5"/>
    <g fill="#173B63">
      <rect x="126" y="205" width="30" height="105" rx="3"/>
      <rect x="190" y="205" width="30" height="105" rx="3"/>
      <rect x="254" y="205" width="30" height="105" rx="3"/>
    </g>
    <path d="M75 324 H335 V345 H75Z" fill="url(#gold)"/>

    <!-- Community network nodes -->
    <g fill="none" stroke="#78C99A" stroke-width="5" stroke-linecap="round">
      <path d="M70 120 L34 88 M340 120 L376 88 M64 275 L25 305 M346 275 L385 305"/>
    </g>
    <g fill="url(#green)">
      <circle cx="34" cy="88" r="11"/><circle cx="376" cy="88" r="11"/>
      <circle cx="25" cy="305" r="11"/><circle cx="385" cy="305" r="11"/>
    </g>
  </g>

  <!-- Main identity -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="555" y="205" font-size="30" font-weight="700" letter-spacing="8" fill="#8ED6A2">ABIA STATE</text>
    <text x="545" y="315" font-size="112" font-weight="900" letter-spacing="1" fill="#FFFFFF">ABIA</text>
    <text x="550" y="390" font-size="49" font-weight="800" letter-spacing="4" fill="#FFD36A">CHAMBER OF</text>
    <text x="550" y="455" font-size="49" font-weight="800" letter-spacing="4" fill="#FFD36A">COMMERCE</text>
    <path d="M555 492 H1055" stroke="#FFFFFF" stroke-width="3" opacity=".55"/>
    <text x="555" y="540" font-size="24" font-weight="600" letter-spacing="2" fill="#EAF1F7">CONNECTING BUSINESSES</text>
    <text x="555" y="575" font-size="24" font-weight="600" letter-spacing="2" fill="#EAF1F7">BUILDING ABIA'S PROSPERITY</text>
  </g>
</svg>
