<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quote Request Received | Ginsolo Ventures</title>

    <meta
        name="description"
        content="Confirmation page for a Ginsolo Ventures haulage quote request."
    >

    <link rel="stylesheet" href="styles/base.css">

</head>


<body>

<main class="confirmation-page">

    <section class="confirmation-card">

        <p class="eyebrow">
            Request Received
        </p>

        <h1>
            Thank You!
        </h1>

        <p>
            Your haulage quote request has been submitted.
            Ginsolo Ventures can review your project information
            and follow up with you.
        </p>

        <a
            class="button primary-button"
            href="index.html"
        >
            Return Home
        </a>

    </section>

</main>
<section class="section" aria-labelledby="details-heading">
  <h2 id="details-heading">Your Submitted Details</h2>
  <dl id="submitted-details">
    <p>Loading your submitted information...</p>
  </dl>
</section>

<script type="module">
  const params = new URLSearchParams(window.location.search);

  const fields = [
    ["name", "Full Name"],
    ["email", "Email Address"],
    ["phone", "Phone Number"],
    ["material", "Material Required"],
    ["location", "Delivery Location"],
    ["quantity", "Estimated Quantity"],
    ["message", "Project Details"],
    ["consent", "Consent"]
  ];

  const container = document.querySelector("#submitted-details");
  container.replaceChildren();

  for (const [key, label] of fields) {
    const value = params.get(key);

    if (value !== null && value.trim() !== "") {
      const term = document.createElement("dt");
      const description = document.createElement("dd");

      term.textContent = label;
      description.textContent = value;

      container.append(term, description);
    }
  }

  if (!container.children.length) {
    container.textContent =
      "No submitted information was found.";
  }
</script>
</body>
</html>
